indicator:
  name: Leaf and Bloom Dates
  slug: leaf-and-bloom-dates
  publisher: U.S. Environmental Protection Agency
  source_page: https://19january2025snapshot.epa.gov/climate-indicators/climate-change-indicators-leaf-and-bloom-dates/index.html
  technical_documentation: https://19january2025snapshot.epa.gov/system/files/documents/2024-06/leaf-bloom-dates_documentation.pdf
  rights: Public domain, work of the U.S. Government (17 U.S.C. 105)
datasets:
- file: first_leaf_bloom_deviation_contiguous_48.csv
  figure: Figure 1
  figure_title: Figure 1. First Leaf and Bloom Dates in the Contiguous 48 States,
    1900-2023
  source_file: leaf-bloom_fig-1.csv
  source_sha256: 316c7e6559b7d9788ae29c75e82962945b7882ad97a3f999855f7ac319747b49
  source_encoding: UTF-8
  data_source: Schwartz, 2024
  web_update: June 2024
  unit: days deviation from 1981-2010 average
  rows: 496
  columns:
  - name: year
    type: integer
    description: Calendar year of the observation.
  - name: event
    type: string
    description: 'Phenological event: first leaf or first bloom.'
  - name: statistic
    type: string
    description: annual_mean is the yearly average deviation; 9yr_normal_curve is
      EPA's smoothed 9-year curve.
  - name: value
    type: number
    description: 'Value in the dataset''s unit (days). Years: deviation from the 1981-2010
      average. Maps: change in first-event date between 1951-1960 and 2014-2023.'
